apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dns-probe-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dns-probe
  endpoints:
    - port: metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: connectivity-probe-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: connectivity-probe
  endpoints:
    - port: metrics
      interval: 15s
