apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: network-healing-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: network-healing
      rules:
        - alert: DNSResolutionFailed
          expr: dns_healthy == 0
          for: 15s
          labels:
            severity: critical
            component: dns
          annotations:
            summary: "DNS resolution is failing"
        - alert: DNSLatencyHigh
          expr: dns_latency_ms > 100
          for: 30s
          labels:
            severity: warning
            component: dns
          annotations:
            summary: "DNS latency is high (>100ms)"
        - alert: PodConnectivityBlocked
          expr: connectivity_success == 0
          for: 15s
          labels:
            severity: critical
            component: networkpolicy
          annotations:
            summary: "Pod-to-pod connectivity is blocked"
        - alert: CNIPodCrash
          expr: >
            kube_pod_status_phase{namespace="calico-system", phase="Failed"} > 0 or 
            increase(kube_pod_container_status_restarts_total{namespace="calico-system"}[5m]) > 0 or
            kube_pod_status_phase{namespace="kube-flannel", phase="Failed"} > 0 or 
            increase(kube_pod_container_status_restarts_total{namespace="kube-flannel"}[5m]) > 0
          for: 15s
          labels:
            severity: critical
            component: cni
          annotations:
            summary: "CNI (Calico or Flannel) node pod is failing or crashing"
