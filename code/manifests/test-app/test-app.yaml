---
# Namespace 1 for test app
apiVersion: v1
kind: Namespace
metadata:
  name: test-namespace-1
---
# Namespace 2 for test app
apiVersion: v1
kind: Namespace
metadata:
  name: test-namespace-2
---
# Test app in namespace 1 - nginx server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-server-1
  namespace: test-namespace-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
      instance: server-1
  template:
    metadata:
      labels:
        app: nginx
        instance: server-1
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service for nginx-server-1
apiVersion: v1
kind: Service
metadata:
  name: nginx-server-1
  namespace: test-namespace-1
spec:
  selector:
    app: nginx
    instance: server-1
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
# Test app in namespace 2 - curl client
apiVersion: v1
kind: Pod
metadata:
  name: curl-client-2
  namespace: test-namespace-2
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ["/bin/sh"]
    args: ["-c", "sleep 3600"]
  restartPolicy: Always
---
# Test app in namespace 1 - curl client for reverse testing
apiVersion: v1
kind: Pod
metadata:
  name: curl-client-1
  namespace: test-namespace-1
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ["/bin/sh"]
    args: ["-c", "sleep 3600"]
  restartPolicy: Always
