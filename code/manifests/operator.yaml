apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-operator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-operator-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-operator-binding
subjects:
- kind: ServiceAccount
  name: network-operator
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: network-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: network-operator-webhook
  namespace: kube-system
spec:
  selector:
    app: network-operator
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-operator
  namespace: kube-system
  labels:
    app: network-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-operator
  template:
    metadata:
      labels:
        app: network-operator
    spec:
      serviceAccountName: network-operator
      containers:
      - name: operator
        image: network-operator:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
