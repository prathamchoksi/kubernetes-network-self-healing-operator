apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-probes
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-probes-role
rules:
  - apiGroup: ""
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroup: ""
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroup: "networking.k8s.io"
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-probes-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-probes-role
subjects:
  - kind: ServiceAccount
    name: network-probes
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-probe
  namespace: monitoring
  labels:
    app: dns-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-probe
  template:
    metadata:
      labels:
        app: dns-probe
    spec:
      serviceAccountName: network-probes
      containers:
        - name: probe
          image: network-probes:latest
          imagePullPolicy: Never
          command: ["python", "dns_probe.py"]
          ports:
            - containerPort: 8000
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: dns-probe
  namespace: monitoring
  labels:
    app: dns-probe
spec:
  selector:
    app: dns-probe
  ports:
    - port: 8000
      targetPort: 8000
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectivity-probe
  namespace: monitoring
  labels:
    app: connectivity-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connectivity-probe
  template:
    metadata:
      labels:
        app: connectivity-probe
    spec:
      serviceAccountName: network-probes
      containers:
        - name: probe
          image: network-probes:latest
          imagePullPolicy: Never
          command: ["python", "connectivity_probe.py"]
          ports:
            - containerPort: 8001
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: connectivity-probe
  namespace: monitoring
  labels:
    app: connectivity-probe
spec:
  selector:
    app: connectivity-probe
  ports:
    - port: 8001
      targetPort: 8001
      name: metrics
